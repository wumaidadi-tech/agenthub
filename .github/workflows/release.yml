name: build-exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 把 AgentHub.exe 挂到哪个 Release
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run icon
      - run: npm run build:exe
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "AgentHub $TAG" --notes "见 README"
          gh release upload "$TAG" dist/AgentHub.exe --clobber